services:
  snowluma:
    image: ${SNOWLUMA_IMAGE:-motricseven7/snowluma:v2.0.3}
    container_name: snowluma
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 900m
    cpus: 1.0
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    ulimits:
      nofile: { soft: 65536, hard: 1048576 }
    environment:
      TZ: Asia/Shanghai
      SNOWLUMA_SCREEN: 1280x720x24
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_LOG_LEVEL: info
      SNOWLUMA_QQ_FLAGS: --disable-gpu --disable-software-rasterizer --disable-gpu-compositing
    ports:
      - 127.0.0.1:6081:6081
      - 127.0.0.1:5099:5099
    volumes:
      - ./snowluma/data:/app/data
      - ./snowluma/config:/app/.config
      - ./snowluma/share:/app/.local/share
    networks: [bot]
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  koishi:
    build: .
    image: pjsk-koishi:1.0.0
    container_name: koishi
    restart: unless-stopped
    mem_limit: 450m
    cpus: 0.75
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      QQ_BOT_ID: ${QQ_BOT_ID}
      ONEBOT_TOKEN: ${ONEBOT_TOKEN}
      PLUGIN_API_KEY: ${PLUGIN_API_KEY}
      KOISHI_ADMIN_PASSWORD: ${KOISHI_ADMIN_PASSWORD}
    ports:
      - 127.0.0.1:5140:5140
    volumes:
      - ./koishi-runtime:/koishi
    networks: [bot]
    logging: *logging
networks:
  bot:
    external: true
    name: ${BOT_NETWORK:-langbot-network}
